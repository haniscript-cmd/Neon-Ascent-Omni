name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Build Web Assets
        run: |
          if [ -s "public/app-icon.png" ]; then
            cp -f public/app-icon.png public/pwa-512x512.png
            cp -f public/app-icon.png public/pwa-192x192.png
            cp -f public/app-icon.png public/apple-touch-icon.png
          elif [ -s "app-icon.png" ]; then
            cp -f app-icon.png public/pwa-512x512.png
            cp -f app-icon.png public/pwa-192x192.png
            cp -f app-icon.png public/apple-touch-icon.png
          fi
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor, Generate Android Project & Apply Custom App Icon
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          rm -rf android
          npx cap add android
          npx cap sync android
          mkdir -p assets
          cp -f public/pwa-512x512.png assets/icon-only.png
          cp -f public/pwa-512x512.png assets/icon-foreground.png
          cp -f public/pwa-512x512.png assets/icon-background.png
          cp -f public/pwa-512x512.png assets/splash.png
          cp -f public/pwa-512x512.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#04050a' --iconBackgroundColorDark '#04050a' --splashBackgroundColor '#04050a' --splashBackgroundColorDark '#04050a' || true

      - name: Configure Native Android Immersive Fullscreen (No Top/Bottom Bars)
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.neonascent.omni;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonAscent-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
